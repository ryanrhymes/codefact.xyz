<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/images/favicon-32x32.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header{% if page.dark_header %} site-header-dark{% endif %}">
    <div class="container">
      {% if page.dark_header %}{% assign logo = '/images/logo/logo-white.svg' %}{% else %}{% assign logo = '/images/logo/logo.svg' %}{% endif %}
      <a href="{{ '/' | relative_url }}" class="brand">
        <img src="{{ logo | relative_url }}" alt="{{ site.title }}" width="140" height="24">
      </a>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© {{ site.time | date: '%Y' }} Codefact Oy</span>
      <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
    </div>
  </footer>

  {% include google-analytics.html %}
</body>
</html>
