---
layout: default
bodyClass: "page-services"
---

<div class="strip">
    <div class="container pt-6 pb-6 pb-md-10">
  
      {% for post in site.posts %}
        {% assign words = post.content | strip_html | number_of_words %}
        {% assign duration = words | divided_by: 200 | plus: 1 %}
        <div class="col-12 col-md-9 mb-1">
          <div class="service service-summary">
          <div class="service-content">
            <h2 class="service-title">
              <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
            </h2>
            <!--
            <div style="font-size: 0.8em; color: gray; margin-bottom: 0.5em;">Date: {{ post.date }}, Length: {{words}} words, Duration: {{duration}} min read</div>
            -->
            <p>{{ post.excerpt | markdownify | strip_html | truncate: 200 }}</p>
          </div>
          </div>
        </div>
      {% endfor %}
  
    </div>
  </div>
